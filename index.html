<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>iNeed</title>
<style>
  :root {
    --color-bg: #000000;
    --color-text: #f5f5f5;
    --color-accent: #ec3013;
    --color-neutral-500: #8a8a8a;
    --color-neutral-700: #a0a0a0;
    --font-heading: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    --font-body: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; height: 100%; width: 100%; background: var(--color-bg); color: var(--color-text); font-family: var(--font-body); }
  a { color: var(--color-accent); }
  a:hover { color: #ae1800; }
  .page { display: none; flex-direction: column; min-height: 100vh; }
  .active { display: flex; }
  main.home { flex: 1; display: flex; flex-direction: column; align-items: center; text-align: center; padding: 0 24px 64px; position: relative; }
  .logo { position: absolute; top: 24px; left: 24px; max-width: 110px; width: 100%; height: auto; display: block; }
  .slogan-wrap { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; padding-top: 60px; }
  .slogan { font-family: var(--font-body); font-weight: 700; letter-spacing: -0.02em; font-size: clamp(40px, 7vw, 84px); line-height: 1.15; max-width: 900px; margin: 0; color: var(--color-text); }
  footer { padding: 16px 24px; text-align: center; }
  .footer-inner { display: flex; flex-direction: column; align-items: center; gap: 6px; }
  .footer-contact { margin: 0; font-size: 11px; color: var(--color-neutral-700); }
  .footer-contact a { font-weight: 600; text-decoration: none; color: var(--color-neutral-700); }
  .footer-links { display: flex; justify-content: center; gap: 16px; flex-wrap: wrap; }
  .footer-links a { color: var(--color-neutral-500); text-decoration: none; font-size: 11px; }
  .lang-switch { font-size: 11px; color: var(--color-neutral-500); }
  .lang-switch a { color: var(--color-neutral-500); text-decoration: none; }
  .lang-switch a.current { color: var(--color-text); font-weight: 700; }
</style>
</head>
<body>

  <div class="page active">
    <main class="home">
      <img src="ineed-logo.png" alt="iNeed Logo" class="logo">
      <div class="slogan-wrap">
        <p class="slogan" data-i18n="slogan">If you hate Capitalism, then you will love this.</p>
      </div>
    </main>
    <footer>
      <div class="footer-inner">
        <nav class="lang-switch" aria-label="Language"></nav>
        <p class="footer-contact"><span data-i18n="contact">Contact</span> <a href="mailto:ineedtosavetheworld@gmail.com">ineedtosavetheworld@gmail.com</a></p>
        <div class="footer-links">
          <a href="privacy.html" data-i18n="privacy">Privacy Policy</a>
          <a href="terms.html" data-i18n="terms">Terms of Use</a>
          <a href="impressum.html" data-i18n="impressum">Legal notice</a>
          <a href="child-safety.html" data-i18n="childsafety">Child safety</a>
        </div>
      </div>
    </footer>
  </div>

  <script src="lang.js"></script>
  <script>
    // Alte Adressen mit #privacy, #terms und #impressum führen zu den eigenen Seiten.
    (function () {
      var map = { privacy: "privacy.html", terms: "terms.html", impressum: "impressum.html" };
      var target = map[location.hash.replace("#", "")];
      if (target) location.replace(target);
    })();
  </script>
</body>
</html>
