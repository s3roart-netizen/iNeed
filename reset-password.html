<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="dark">
<meta name="theme-color" content="#000000">
<meta name="robots" content="noindex">
<title>iNeed – Neues Passwort / New password</title>
<link rel="icon" href="ineed-logo.png">
<style>
  * { box-sizing: border-box; }
  html { background: #000; }
  body {
    margin: 0; min-height: 100vh; background: #000; color: #fff;
    font-family: -apple-system, BlinkMacSystemFont, "Helvetica Neue", Arial, system-ui, sans-serif;
    line-height: 1.5; -webkit-font-smoothing: antialiased;
  }
  .wrap { max-width: 480px; margin: 0 auto; padding: 32px 28px 40px; }
  .logo { display: block; width: 84px; height: auto; margin: 0 0 20px; border: 0; }
  h1 { margin: 0 0 12px; font-size: 20px; font-weight: 700; color: #fff; }
  p.sub { margin: 0 0 24px; font-size: 15px; color: #d1d1d6; }
  label { display: block; margin: 18px 0 6px; font-size: 13px; font-weight: 600; color: #8e8e93; }
  input {
    width: 100%; padding: 14px 16px; font-size: 16px; color: #fff;
    background: #1c1c1e; border: 1px solid #2c2c2e; border-radius: 14px; outline: none;
    transition: border-color .15s ease, box-shadow .15s ease;
  }
  input:focus { border-color: rgba(153,243,51,.7); box-shadow: 0 0 0 3px rgba(153,243,51,.18); }
  button {
    width: 100%; margin-top: 28px; padding: 14px 36px; font-size: 16px; font-weight: 600; color: #fff; cursor: pointer;
    border-radius: 16px; border: 1px solid rgba(215,255,160,.55);
    background-color: rgba(153,243,51,.24);
    background-image: linear-gradient(180deg, rgba(190,255,110,.50) 0%, rgba(153,243,51,.16) 55%, rgba(153,243,51,.28) 100%);
    box-shadow: inset 0 1px 0 rgba(255,255,255,.55), inset 0 -1px 0 rgba(255,255,255,.12), 0 6px 24px rgba(153,243,51,.28);
    text-shadow: 0 1px 2px rgba(0,0,0,.45);
  }
  button:active { transform: scale(.99); }
  button:disabled { opacity: .5; cursor: default; }
  .msg { margin: 0 0 20px; padding: 14px 16px; border-radius: 14px; font-size: 15px; }
  .error { background: rgba(255,69,58,.14); border: 1px solid rgba(255,69,58,.35); color: #ff8a82; }
  .ok { background: rgba(153,243,51,.12); border: 1px solid rgba(153,243,51,.4); color: #b6f56b; }
  .hidden { display: none; }
  hr { margin: 36px 0 20px; border: 0; border-top: 1px solid #2c2c2e; }
  .foot { margin: 0; font-size: 12px; color: #8e8e93; }
  .foot a { color: #8e8e93; }
  .site-footer { margin: 12px 0 0; font-size: 12px; color: #8e8e93; display: flex; flex-wrap: wrap; gap: 6px 14px; }
  .site-footer a { color: #8e8e93; }
  .lang-switch { margin: 0 0 14px; font-size: 12px; color: #8e8e93; }
  .lang-switch a { color: #8e8e93; text-decoration: none; }
  .lang-switch a.current { color: #fff; font-weight: 700; }
</style>
</head>
<body>
<div class="wrap">
  <a href="index.html" aria-label="Zur Startseite"><img class="logo" src="ineed-logo.png" alt="iNeed" width="84"></a>
  <nav class="lang-switch" aria-label="Language"></nav>
  <h1 data-i18n="rp_title">Neues Passwort festlegen</h1>
  <p class="sub" id="subtitle" data-i18n="rp_sub">Wähle ein neues Passwort für dein iNeed-Konto.</p>

  <div id="status" class="msg hidden"></div>

  <form id="form" class="hidden" autocomplete="off">
    <label for="pw" data-i18n="rp_pw">Neues Passwort</label>
    <input id="pw" type="password" minlength="6" required autocomplete="new-password">
    <label for="pw2" data-i18n="rp_pw2">Wiederholen</label>
    <input id="pw2" type="password" minlength="6" required autocomplete="new-password">
    <button id="submit" type="submit" data-i18n="rp_save">Passwort speichern</button>
  </form>

  <hr>
  <p class="foot" data-i18n="rp_note">Du hast diese Seite über einen Link in einer E-Mail von iNeed geöffnet. Falls du kein neues Passwort angefordert hast, kannst du sie schließen.</p>
  <footer class="site-footer" data-current="reset-password.html"></footer>
  <p class="foot" style="margin-top:12px;">© iNeed</p>
</div>

<script src="lang.js"></script>
<script src="supabase.js"></script>
<script>
  // Der anon-Key ist öffentlich vorgesehen (er steckt auch in den Apps); Zugriff regelt Supabase serverseitig.
  const client = supabase.createClient(
    "https://twwabenfpppyfckbdmwy.supabase.co",
    "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InR3d2FiZW5mcHBweWZja2JkbXd5Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODE0NDYzMDQsImV4cCI6MjA5NzAyMjMwNH0.lnkXrBp0oPJ-pUCKr1JUndKRKn7yYUl853faivHbYxs",
    { auth: { persistSession: false, detectSessionInUrl: false } }
  );

  const statusBox = document.getElementById("status");
  const form = document.getElementById("form");
  const submit = document.getElementById("submit");

  function show(text, kind) {
    statusBox.textContent = text;
    statusBox.className = "msg " + kind;
  }

  async function start() {
    const params = new URLSearchParams(window.location.search);
    const tokenHash = params.get("token_hash");
    if (!tokenHash || params.get("type") !== "recovery") {
      show(iNeedT("rp_invalid"), "error");
      return;
    }
    // Den Token aus der Adresszeile entfernen, bevor etwas anderes passiert.
    history.replaceState(null, "", window.location.pathname);
    const { error } = await client.auth.verifyOtp({ token_hash: tokenHash, type: "recovery" });
    if (error) {
      show(iNeedT("rp_expired"), "error");
      return;
    }
    statusBox.className = "hidden";
    form.classList.remove("hidden");
  }

  form.addEventListener("submit", async (event) => {
    event.preventDefault();
    const pw = document.getElementById("pw").value;
    const pw2 = document.getElementById("pw2").value;
    if (pw.length < 6) { show(iNeedT("rp_minlen"), "error"); return; }
    if (pw !== pw2) { show(iNeedT("rp_mismatch"), "error"); return; }
    submit.disabled = true;
    const { error } = await client.auth.updateUser({ password: pw });
    if (error) {
      submit.disabled = false;
      show(iNeedT("rp_failed") + " " + error.message, "error");
      return;
    }
    await client.auth.signOut();
    form.classList.add("hidden");
    show(iNeedT("rp_saved"), "ok");
  });

  start();
</script>
</body>
</html>
