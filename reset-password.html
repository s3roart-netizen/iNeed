<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>iNeed – Neues Passwort / New password</title>
<style>
  body { font-family: -apple-system, system-ui, Helvetica, Arial, sans-serif; max-width: 420px; margin: 0 auto; padding: 48px 20px; line-height: 1.5; color: #1c1c1e; background: #fff; }
  @media (prefers-color-scheme: dark) { body { color: #f2f2f7; background: #000; } input { background: #1c1c1e; color: #f2f2f7; border-color: #3a3a3c; } }
  h1 { font-size: 1.6rem; margin-bottom: .25rem; }
  p.sub { color: #8e8e93; margin-top: 0; }
  label { display: block; margin: 1rem 0 .25rem; font-weight: 600; }
  input { width: 100%; box-sizing: border-box; padding: 12px; font-size: 1rem; border: 1px solid #c7c7cc; border-radius: 10px; }
  button { width: 100%; margin-top: 1.5rem; padding: 14px; font-size: 1rem; font-weight: 600; border: 0; border-radius: 12px; background: #99F333; color: #1c1c1e; cursor: pointer; }
  button:disabled { opacity: .5; cursor: default; }
  .msg { margin-top: 1rem; padding: 12px; border-radius: 10px; }
  .error { background: #ff3b3022; color: #d70015; }
  .ok { background: #34c75922; color: #1f7a35; }
  .hidden { display: none; }
</style>
</head>
<body>
<h1>iNeed</h1>
<p class="sub" id="subtitle">Neues Passwort festlegen / Set a new password</p>

<div id="status" class="msg hidden"></div>

<form id="form" class="hidden" autocomplete="off">
  <label for="pw">Neues Passwort / New password</label>
  <input id="pw" type="password" minlength="6" required autocomplete="new-password">
  <label for="pw2">Wiederholen / Repeat</label>
  <input id="pw2" type="password" minlength="6" required autocomplete="new-password">
  <button id="submit" type="submit">Passwort speichern / Save password</button>
</form>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<script>
  // Der anon-Key ist öffentlich vorgesehen (er steckt auch in den Apps); Zugriff regelt Supabase serverseitig.
  const client = supabase.createClient(
    "https://twwabenfpppyfckbdmwy.supabase.co",
    "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InR3d2FiZW5mcHBweWZja2JkbXd5Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODE0NDYzMDQsImV4cCI6MjA5NzAyMjMwNH0.lnkXrBp0oPJ-pUCKr1JUndKRKn7yYUl853faivHbYxs",
    { auth: { persistSession: false, detectSessionInUrl: false } }
  );

  const statusBox = document.getElementById("status");
  const form = document.getElementById("form");
  const submit = document.getElementById("submit");

  function show(text, kind) {
    statusBox.textContent = text;
    statusBox.className = "msg " + kind;
  }

  async function start() {
    const params = new URLSearchParams(window.location.search);
    const tokenHash = params.get("token_hash");
    if (!tokenHash || params.get("type") !== "recovery") {
      show("Dieser Link ist ungültig. Fordere in der App unter „Passwort vergessen?“ einen neuen an. / This link is invalid. Request a new one in the app under “Forgot password?”.", "error");
      return;
    }
    // Den Token aus der Adresszeile entfernen, bevor etwas anderes passiert.
    history.replaceState(null, "", window.location.pathname);
    const { error } = await client.auth.verifyOtp({ token_hash: tokenHash, type: "recovery" });
    if (error) {
      show("Der Link ist abgelaufen oder wurde schon benutzt. Fordere in der App einen neuen an. / The link has expired or was already used. Request a new one in the app.", "error");
      return;
    }
    statusBox.className = "hidden";
    form.classList.remove("hidden");
  }

  form.addEventListener("submit", async (event) => {
    event.preventDefault();
    const pw = document.getElementById("pw").value;
    const pw2 = document.getElementById("pw2").value;
    if (pw.length < 6) { show("Mindestens 6 Zeichen. / At least 6 characters.", "error"); return; }
    if (pw !== pw2) { show("Die Passwörter stimmen nicht überein. / The passwords do not match.", "error"); return; }
    submit.disabled = true;
    const { error } = await client.auth.updateUser({ password: pw });
    if (error) {
      submit.disabled = false;
      show("Das Passwort konnte nicht gespeichert werden: " + error.message, "error");
      return;
    }
    await client.auth.signOut();
    form.classList.add("hidden");
    show("Passwort gespeichert. Du kannst dich jetzt in der App anmelden. / Password saved. You can now sign in in the app.", "ok");
  });

  start();
</script>
</body>
</html>
